# web/ 사이트를 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source가 "GitHub Actions"여야 한다 (설정 완료).
name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      # 지금 Pages에 걸려 있는 도메인·인증서 상태를 배포 기록에 남긴다 (문제가 생겼을 때 확인용).
      - name: Pages domain and certificate state
        run: gh api "repos/${{ github.repository }}/pages" --jq '{cname, html_url, https_enforced, https_certificate}' || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
        env:
          # 사이트는 항상 자체 도메인 기준으로 만든다. Pages 설정에서 도메인을 잠깐 뺐다 넣어도
          # (인증서 재발급 등) 그 순간의 설정에 따라 주소와 경로가 바뀌지 않게 하기 위해서다.
          SITE_URL: https://opticorelabs.co.kr
          BASE_PATH: /
      # 깨진 내부 링크가 하나라도 있으면 배포하지 않는다
      - run: node scripts/check-links.mjs
        env:
          SITE_URL: https://opticorelabs.co.kr
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
