# web/ 사이트를 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source가 "GitHub Actions"여야 한다 (설정 완료).
name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      # 사이트 안의 대표 주소(canonical, sitemap, llms.txt)는 항상 https로 적는다.
      # "Enforce HTTPS"를 켜기 전에는 Pages가 http 주소를 돌려주기 때문에 여기서 바꿔 준다.
      - run: echo "SITE_URL=${ORIGIN/#http:/https:}" >> "$GITHUB_ENV"
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
      - run: npm run build
        env:
          # 자체 도메인을 연결하면 BASE_PATH가 비어 "/"로 빌드된다.
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
